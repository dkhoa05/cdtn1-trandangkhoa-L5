# Chạy cả hệ thống bằng hai lệnh: copy .env.example .env rồi docker compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Chua co .env - hay chep tu .env.example}
      POSTGRES_DB: ${DB_NAME:-cdtn1_l5_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-cdtn1_l5_dev}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Chua co .env - hay chep tu .env.example}
      SECRET_KEY: ${SECRET_KEY:?Chua co .env - hay chep tu .env.example}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Chua co .env - hay chep tu .env.example}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PORT:-5000}:5000"
    # Dựng bảng và nạp dữ liệu mẫu (chạy lại không nhân đôi) rồi mới khởi động máy chủ
    command: sh -c "python -m src.db_init && flask --app src.app:create_app run --host 0.0.0.0 --port 5000"

volumes:
  pgdata:
