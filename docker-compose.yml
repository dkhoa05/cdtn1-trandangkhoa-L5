# Chạy cả hệ thống bằng: docker compose up --build
# Giá trị mật khẩu và SECRET_KEY dưới đây chỉ để chạy thử cục bộ, không dùng cho môi trường thật.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo_docker
      POSTGRES_DB: cdtn1_l5_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdtn1_l5_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cdtn1_l5_dev
      DB_USER: postgres
      DB_PASSWORD: demo_docker
      SECRET_KEY: khoa-chi-de-chay-thu
      LOG_LEVEL: INFO
    ports:
      - "5000:5000"
    # Dựng bảng và nạp dữ liệu mẫu (chạy lại không nhân đôi) rồi mới khởi động máy chủ
    command: sh -c "python -m src.db_init && flask --app src.app:create_app run --host 0.0.0.0 --port 5000"

volumes:
  pgdata:
